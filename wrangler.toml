name = "inventory-management-system"
compatibility_date = "2024-11-19"
pages_build_output_dir = "./build/client"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "inventory-dev"
database_id = "local-database"

# R2 Storage
[[r2_buckets]]
binding = "R2"
bucket_name = "inventory-images"

# KV Namespace (optional - for caching)
[[kv_namespaces]]
binding = "KV"
id = "local-kv"

[vars]
ENVIRONMENT = "development"
